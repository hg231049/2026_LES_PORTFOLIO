    <script>
      const dashCards = document.querySelectorAll(".card");

      dashCards.forEach((card) => {
        card.classList.add("is-loading");
        setTimeout(() => {
          card.classList.remove("is-loading");
        }, 1200);
        card.addEventListener("click", () => {
          setTimeout(() => {
            const isActive = card.getAttribute("data-active") === "true";
            card.setAttribute("data-active", isActive ? "false" : "true");
          }, 500);
        });
      });

      function toggleDarkMode() {
        // html 태그에 dark 클래스를 넣었다 뺐다 함
        document.documentElement.classList.toggle("dark");
      }

      // 1. 관찰자 설정
      const observerOptions = {
        threshold: 0.2, // 요소의 20%가 보일 때 실행
      };

      // 1. 공통 옵션 설정 (필요에 따라 각각 다르게 줘도 됩니다)
      const revealOptions = { threshold: 0.2 }; // 요소가 20% 보일 때 등장
      const themeOptions = { threshold: 0.5 }; // 섹션이 50% 보일 때 다크모드 전환

      //IntersectionObserver : 내가 지정한 대상이 화면(View Port)에 들어왔는지 체크. $(window).scroll()과 .offset().top과 비슷한 역할.

      // --- A. 등장 애니메이션 Observer ---
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          //제이쿼리의 .each()와 같습니다.
          if (entry.isIntersecting) {
            // $(this).is(':visible') 같은 느낌입니다.
            // 초기 설정해둔 투명도와 위치값을 복구
            entry.target.classList.remove("opacity-0", "translate-y-20");
            entry.target.classList.add("opacity-100", "translate-y-0");

            // 관찰 중단 (한 번만 실행하고 싶을 때)
            //unobserve : 한 번 등장 애니메이션이 끝난 요소는 다시 감시하지 않게 되어, 메모리를 아끼고 성능을 높임
            revealObserver.unobserve(entry.target);
          } /*else {
                    // [중요] 화면에서 나갔을 때 스타일을 초기화 (Reset)
                    // 이렇게 해야 다시 내려올 때 애니메이션이 작동합니다.
                    entry.target.classList.add('opacity-0', 'translate-y-20');
                    entry.target.classList.remove('opacity-100', 'translate-y-0');
                }*/
        });
      }, revealOptions);

      // --- B. 다크모드 전환 Observer ---
      const themeObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            // 다크 섹션에 들어오면 다크모드 ON
            document.documentElement.classList.add("dark");
          } else {
            // 다크 섹션에서 나가면 다크모드 OFF
            document.documentElement.classList.remove("dark");
          }
        });
      }, themeOptions);

      // --- 2. 관찰 대상 등록 ---
      // 모든 카드 요소들에 등장 효과 감시 시작
      // 제이쿼리: $('.card').each(function() { observer.observe(this); });
      // observe : 이 요소를 감시 리스트에 등록해!"**라고 카메라(Observer)에게 명령하는 버튼
      document
        .querySelectorAll(".card")
        .forEach((el) => revealObserver.observe(el));

      // 특정 ID를 가진 섹션에 다크모드 트리거 감시 시작
      const darkSection = document.querySelector("#practiceCard");
      if (darkSection) themeObserver.observe(darkSection);

      /*------ 특정 섹션 가로 스크롤 -----*/
      const wrapper = document.querySelector("#sticky-wrapper");
      const track = document.querySelector("#horizontal-track");

      window.addEventListener("scroll", () => {
        // 1. wrapper가 화면 상단에 닿은 시점부터의 거리 계산
        const offsetTop = wrapper.offsetTop;
        const scrollTop = window.pageYOffset;
        const distance = scrollTop - offsetTop;

        // 2. 섹션 안에서만 작동하도록 범위 제한
        if (
          distance >= 0 &&
          distance <= wrapper.offsetHeight - window.innerHeight
        ) {
          // 3. 스크롤 거리에 따라 왼쪽으로 이동 (translateX)
          // 이동 비율은 적절히 조정 가능합니다.
          const moveX =
            (distance / (wrapper.offsetHeight - window.innerHeight)) * 70;
          track.style.transform = `translateX(-${moveX}%)`;
        }
      });
    </script>
